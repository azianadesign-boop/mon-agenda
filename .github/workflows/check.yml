name: Check activation server
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          U=https://girly-activation.azianadesign.workers.dev
          { echo "root: $(curl -s $U/)"
            echo "bad: $(curl -s -X POST $U/activate -H 'Content-Type: application/json' -d '{"code":"GIRLY-AAAA-BBBB","device":"check"}')"
            for d in a b c d e; do echo "owner $d: $(curl -s -X POST $U/activate -H 'Content-Type: application/json' -d "{\"code\":\"GIRLYXZBF8MUT\",\"device\":\"t$d\"}")"; done
          } > activation/check.txt
          cat activation/check.txt
          git config user.name github-actions && git config user.email actions@github.com
          git add activation/check.txt && git commit -m "check result [skip ci]" && git push || true
