name: Check activation server
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://girly-activation.azianadesign.workers.dev
          curl -sf $U/ | tee r1.txt; echo
          curl -sf -X POST $U/activate -H 'Content-Type: application/json' -d '{"code":"GIRLY-AAAA-BBBB","device":"check"}' | tee r2.txt; echo
          curl -sf -X POST $U/admin/api -H 'Content-Type: application/json' -d '{"key":"wrong","action":"list"}' | tee r3.txt; echo || true
          grep -q '"service"' r1.txt && grep -q '"invalid"' r2.txt
          curl -sI -H 'Origin: https://azianadesign-boop.github.io' $U/ | grep -i access-control-allow-origin
# check 1792802083
