<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64">
<defs>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe0eb"/><stop offset=".3" stop-color="#f6a3c0"/><stop offset=".65" stop-color="#e0729b"/><stop offset="1" stop-color="#a8436c"/></linearGradient>
<linearGradient id="rim" x1=".15" y1=".05" x2=".85" y2=".95"><stop offset="0" stop-color="#ffe3ec"/><stop offset=".35" stop-color="#f3a1be"/><stop offset=".7" stop-color="#cf6890"/><stop offset="1" stop-color="#8e3359"/></linearGradient>
<linearGradient id="lip" x1=".15" y1=".05" x2=".85" y2=".95"><stop offset="0" stop-color="#9c3b63"/><stop offset=".5" stop-color="#e889ac"/><stop offset="1" stop-color="#ffd9e6"/></linearGradient>
<linearGradient id="hole" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14040a"/><stop offset=".55" stop-color="#2a0b17"/><stop offset="1" stop-color="#4d1a2f"/></linearGradient>
<radialGradient id="deep" cx=".55" cy=".6" r=".55"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>
<linearGradient id="endL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a1028" stop-opacity=".75"/><stop offset=".55" stop-color="#4a1028" stop-opacity=".15"/><stop offset="1" stop-color="#4a1028" stop-opacity="0"/></linearGradient>
<linearGradient id="endR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#4a1028" stop-opacity=".75"/><stop offset=".55" stop-color="#4a1028" stop-opacity=".15"/><stop offset="1" stop-color="#4a1028" stop-opacity="0"/></linearGradient>
<radialGradient id="hi" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".55" stop-color="#ffe6ef" stop-opacity=".45"/><stop offset="1" stop-color="#ffe6ef" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-10%" y="-40%" width="120%" height="180%"><feDropShadow dx="0" dy="2.5" stdDeviation="1.8" flood-color="#7a2a4c" flood-opacity=".4"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="1.6"/></filter>
<g id="eye">
 <circle r="20" fill="url(#rim)"/>
 <circle r="16.6" fill="none" stroke="url(#lip)" stroke-width="2.6"/>
 <circle r="15.2" fill="url(#hole)"/>
 <circle r="15.2" fill="url(#deep)"/>
 <path d="M-14 -7a16 16 0 0 1 17 -11" fill="none" stroke="#fff4f8" stroke-width="2" stroke-linecap="round" opacity=".9"/>
 <path d="M10 15a17 17 0 0 0 8-8" fill="none" stroke="#ffd2e1" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
</g>
</defs>
<g filter="url(#sh)"><use href="#eye" x="30" y="32"/><use href="#eye" x="170" y="32"/></g>
<!-- ombre portée de l'anneau au fond des trous -->
<ellipse cx="33" cy="41" rx="9" ry="4" fill="#000" opacity=".55" filter="url(#soft)"/>
<ellipse cx="167" cy="41" rx="9" ry="4" fill="#000" opacity=".55" filter="url(#soft)"/>
<g filter="url(#sh)">
 <rect x="24" y="24" width="152" height="16" rx="8" fill="url(#bar)" stroke="#a03e66" stroke-width="1"/>
 <rect x="24" y="24" width="18" height="16" rx="8" fill="url(#endL)"/>
 <rect x="158" y="24" width="18" height="16" rx="8" fill="url(#endR)"/>
 <ellipse cx="100" cy="28.5" rx="50" ry="3.6" fill="url(#hi)"/>
 <path d="M31 27.5a6 6 0 0 1 5-2.2M169 27.5a6 6 0 0 0-5-2.2" fill="none" stroke="#fff0f6" stroke-width="1.3" stroke-linecap="round" opacity=".8"/>
</g>
</svg>
